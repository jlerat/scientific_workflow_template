[build-system]
requires = [
    "setuptools >= 64",
    "cython >= 3.0.10",
    "numpy >= 1.20.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "mypackage"
version = "0.1"
authors = [{name = "Julien Lerat, CSIRO Environment", email="julien.lerat@csiro.au"}]
description = "Scientific workflow package"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["data processing", "rainfall", "streamflow", "rainfall-runoff", "hydrology"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Hydrology"
]    
requires-python = ">= 3.14"

dependencies = [
    "setuptools",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "pandas>=3.0.3",
    "cython>=3.2.5",
    "matplotlib>=3.10.9",
    "pip>=26.1.2",
    "pyproj",
    "pyshp",
    "requests",
    "hydrodiy",
    "pygme"
]

[dependency-groups]
dev = [
    "anybadge>=1.16.0",
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "pytest-allclose>=1.0.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.pyx", "*.pxd", "*.c", "*.h", "*.zip", "*.csv",
       "*.shp", "*.dbf", "*.shx", "*.prj"]

[tool.uv]
no-build-isolation-package = ["mypackage"]
default-groups = []

[tool.uv.sources]
hydrodiy = { git = "https://github.com/csiro-hydroinformatics/hydrodiy" }
pygme = { git = "https://github.com/csiro-hydroinformatics/pygme" }
